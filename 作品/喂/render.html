<!doctype html>
<html><head><meta charset="utf-8"><title>喂 样张</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="scene_ink.js"></script>
<script src="scene_telegraph.js"></script>
<script src="scene_vector.js"></script>
<script>
const SCENES = [[sceneInk, 7], [sceneTelegraph, 7], [sceneVector, 7]];
window.ready = (async () => {
  await loadFonts();
  for (const [s] of SCENES) await s.init();
})();
window.renderAsync = async t => {
  let start = 0;
  for (const [s, d] of SCENES) {
    if (t < start + d || s === SCENES[SCENES.length - 1][0]) { s.draw(t - start); return; }
    start += d;
  }
};
</script></body></html>
